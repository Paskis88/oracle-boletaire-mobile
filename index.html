<!DOCTYPE html>
<html lang="ca">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0">

    <title>Oracle Boletaire</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f1e8;
        }

        h1 {
            margin-top: 10px;
        }

        button {
            width: 100%;
            font-size: 20px;
            padding: 18px;
            margin-top: 15px;
            border-radius: 12px;
            border: none;
            background: white;
        }

        #gps {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 12px;
        }

    </style>

</head>


<body>

    <h1>🍄 Oracle Boletaire</h1>

    <p>Nova troballa</p>


    <button onclick="obtenirGPS()">

        📍 Obtenir la meva ubicació

    </button>


    <div id="gps">

        Ubicació encara no obtinguda.

    </div>


<script>

function obtenirGPS() {

    const resultat =
        document.getElementById("gps");


    if (!navigator.geolocation) {

        resultat.innerHTML =
            "❌ Aquest dispositiu no permet GPS.";

        return;

    }


    resultat.innerHTML =
        "📍 Buscant la ubicació...";


    navigator.geolocation.getCurrentPosition(

        function(posicio) {

            const lat =
                posicio.coords.latitude;

            const lon =
                posicio.coords.longitude;


            resultat.innerHTML =

                "📍 Ubicació trobada<br><br>" +

                "Latitud: " +
                lat.toFixed(6) +

                "<br>" +

                "Longitud: " +
                lon.toFixed(6);

        },


        function(error) {

            resultat.innerHTML =

                "❌ No s'ha pogut obtenir " +
                "la ubicació.<br><br>" +

                "Comprova que has donat " +
                "permís de localització.";

        },

        {

            enableHighAccuracy: true,

            timeout: 15000,

            maximumAge: 0

        }

    );

}

</script>


</body>

</html>
