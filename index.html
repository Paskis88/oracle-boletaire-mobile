<!DOCTYPE html>
<html lang="ca">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Oracle Boletaire</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f4f1e8;
}

h1 {
    margin-top: 10px;
}

.bloc {
    background: white;
    padding: 15px;
    margin-top: 15px;
    border-radius: 12px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

select,
input,
textarea {
    width: 100%;
    box-sizing: border-box;
    font-size: 18px;
    padding: 12px;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid #bbb;
}

button {
    width: 100%;
    font-size: 19px;
    padding: 16px;
    margin-top: 15px;
    border-radius: 12px;
    border: none;
    background: white;
}

#mapa {
    height: 400px;
    width: 100%;
    border-radius: 12px;
}

#gps,
#missatge,
#historial {
    margin-top: 15px;
}

</style>

</head>


<body>

<h1>🍄 Oracle Boletaire</h1>

<div class="bloc">

<h2>📍 Nova troballa</h2>

<button onclick="obtenirGPS()">

📍 OBTENIR LA MEVA UBICACIÓ

</button>

<div id="gps">

Ubicació encara no obtinguda.

</div>


<label>🍄 Espècie</label>

<select id="especie">

<option>Cep</option>
<option>Rovelló</option>
<option>Llenega</option>
<option>Fredolic</option>
<option>Camagroc</option>
<option>Altres</option>

</select>


<label>🔢 Quantitat</label>

<input
    id="quantitat"
    type="number"
    min="1"
    value="1"
>


<label>🪱 Estat</label>

<select id="cucs">

<option>Cap</option>
<option>Alguns</option>
<option>Molts</option>

</select>


<label>📅 Data</label>

<input
    id="data"
    type="text"
    readonly
>


<label>🕐 Hora</label>

<input
    id="hora"
    type="text"
    readonly
>


<label>💬 Comentari</label>

<textarea
    id="comentari"
    rows="4"
></textarea>


<button onclick="guardarTroballa()">

💾 DESAR TROBALLA

</button>


<div id="missatge"></div>

</div>


<div class="bloc">

<h2>🗺️ Mapa de troballes</h2>

<div id="mapa"></div>

</div>


<div class="bloc">

<h2>📜 Historial</h2>

<div id="historial"></div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

let latitud = null;

let longitud = null;


/* DATA I HORA */

function actualitzarDataHora() {

    const ara = new Date();

    const dia =
        String(ara.getDate()).padStart(2, "0");

    const mes =
        String(ara.getMonth() + 1).padStart(2, "0");

    const any =
        ara.getFullYear();

    const hora =
        String(ara.getHours()).padStart(2, "0");

    const minuts =
        String(ara.getMinutes()).padStart(2, "0");

    document.getElementById("data").value =
        dia + "/" + mes + "/" + any;

    document.getElementById("hora").value =
        hora + ":" + minuts;

}


actualitzarDataHora();


/* GPS */

function obtenirGPS() {

    const resultat =
        document.getElementById("gps");


    resultat.innerHTML =
        "📍 Buscant ubicació...";


    navigator.geolocation.getCurrentPosition(

        function(posicio) {

            latitud =
                posicio.coords.latitude;

            longitud =
                posicio.coords.longitude;


            resultat.innerHTML =

                "📍 <b>Ubicació obtinguda ✓</b><br><br>" +

                "Latitud: " +
                latitud.toFixed(6) +

                "<br>" +

                "Longitud: " +
                longitud.toFixed(6);

        },

        function() {

            resultat.innerHTML =
                "❌ No s'ha pogut obtenir el GPS.";

        },

        {

            enableHighAccuracy: true,

            timeout: 15000,

            maximumAge: 0

        }

    );

}


/* GUARDAR */

function guardarTroballa() {

    if (latitud === null) {

        document.getElementById("missatge").innerHTML =
            "⚠️ Primer obtén la ubicació GPS.";

        return;

    }


    const troballa = {

        id: Date.now(),

        data:
            document.getElementById("data").value,

        hora:
            document.getElementById("hora").value,

        latitud:
            latitud,

        longitud:
            longitud,

        especie:
            document.getElementById("especie").value,

        quantitat:
            Number(
                document.getElementById("quantitat").value
            ),

        cucs:
            document.getElementById("cucs").value,

        comentari:
            document.getElementById("comentari").value

    };


    let troballes =
        JSON.parse(
            localStorage.getItem("troballes") || "[]"
        );


    troballes.push(troballa);


    localStorage.setItem(
        "troballes",
        JSON.stringify(troballes)
    );


    document.getElementById("missatge").innerHTML =
        "🍄 <b>Troballa guardada!</b>";

    mostrarHistorial();

    mostrarMapa();

}


/* HISTORIAL */

function mostrarHistorial() {

    const contenidor =
        document.getElementById("historial");


    let troballes =
        JSON.parse(
            localStorage.getItem("troballes") || "[]"
        );


    if (troballes.length === 0) {

        contenidor.innerHTML =
            "🍄 Encara no hi ha troballes.";

        return;

    }


    contenidor.innerHTML = "";


    troballes
        .slice()
        .reverse()
        .forEach(function(t) {

            const element =
                document.createElement("div");

            element.className = "bloc";

            element.innerHTML =

                "<b>🍄 " +
                t.especie +
                "</b><br><br>" +

                "📅 " +
                t.data +
                " · " +
                t.hora +
                "<br>" +

                "🔢 " +
                t.quantitat +
                " unitats<br>" +

                "🪱 " +
                t.cucs +
                "<br><br>" +

                "📍 " +
                t.latitud.toFixed(6) +
                ", " +
                t.longitud.toFixed(6);


            if (t.comentari) {

                element.innerHTML +=
                    "<br><br>💬 " +
                    t.comentari;

            }


            contenidor.appendChild(element);

        });

}


/* MAPA */

function mostrarMapa() {

    const contenidor =
        document.getElementById("mapa");


    contenidor.innerHTML = "";


    let troballes =
        JSON.parse(
            localStorage.getItem("troballes") || "[]"
        );


    let centre = [42.3, 1.2];


    if (troballes.length > 0) {

        centre = [

            troballes[0].latitud,

            troballes[0].longitud

        ];

    }


    const mapa =
        L.map("mapa").setView(
            centre,
            12
        );


    L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {

            attribution:
                "&copy; OpenStreetMap contributors"

        }

    ).addTo(mapa);


    troballes.forEach(function(t) {

        const marcador =
            L.marker([
                t.latitud,
                t.longitud
            ]).addTo(mapa);


        marcador.bindPopup(

            "<b>🍄 " +
            t.especie +
            "</b><br><br>" +

            "📅 " +
            t.data +
            "<br>" +

            "🕐 " +
            t.hora +
            "<br>" +

            "🔢 " +
            t.quantitat +
            " unitats"

        );

    });

}


mostrarHistorial();

mostrarMapa();

</script>


</body>

</html>
