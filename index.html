<!DOCTYPE html>
<html lang="ca">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Oracle Boletaire</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f1e8;
        }

        h1 {
            margin-top: 10px;
        }

        .bloc {
            background: white;
            padding: 15px;
            margin-top: 15px;
            border-radius: 12px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        select,
        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            font-size: 18px;
            padding: 12px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid #bbb;
        }

        button {
            width: 100%;
            font-size: 19px;
            padding: 16px;
            margin-top: 15px;
            border-radius: 12px;
            border: none;
            background: white;
        }

        .principal {
            font-weight: bold;
        }

        #gps {
            margin-top: 10px;
        }

        #missatge {
            margin-top: 15px;
            font-weight: bold;
        }

    </style>

</head>


<body>

    <h1>🍄 Oracle Boletaire</h1>

    <p class="principal">
        ➕ Nova troballa
    </p>


    <div class="bloc">

        <label>📍 Ubicació</label>

        <button onclick="obtenirGPS()">

            📍 OBTENIR LA MEVA UBICACIÓ

        </button>

        <div id="gps">

            Ubicació encara no obtinguda.

        </div>

    </div>


    <div class="bloc">

        <label>🍄 Espècie</label>

        <select id="especie">

            <option>Cep</option>
            <option>Rovelló</option>
            <option>Llenega</option>
            <option>Fredolic</option>
            <option>Camagroc</option>
            <option>Altres</option>

        </select>


        <label>🔢 Quantitat</label>

        <input
            id="quantitat"
            type="number"
            min="1"
            value="1"
        >


        <label>🪱 Estat</label>

        <select id="cucs">

            <option>Cap</option>
            <option>Alguns</option>
            <option>Molts</option>

        </select>


        <label>📅 Data</label>

        <input
            id="data"
            type="text"
            readonly
        >


        <label>🕐 Hora</label>

        <input
            id="hora"
            type="text"
            readonly
        >


        <label>💬 Comentari</label>

        <textarea
            id="comentari"
            rows="4"
            placeholder="Notes sobre la troballa..."
        ></textarea>


        <button
            class="principal"
            onclick="guardarTroballa()"
        >

            💾 DESAR TROBALLA

        </button>


        <div id="missatge"></div>

    </div>

<div class="bloc">

    <h2>📜 Historial</h2>

    <div id="historial">
        Carregant troballes...
    </div>

</div>
<script>

let latitud = null;
let longitud = null;


/* DATA I HORA */

function actualitzarDataHora() {

    const ara = new Date();

    const dia =
        String(ara.getDate()).padStart(2, "0");

    const mes =
        String(ara.getMonth() + 1).padStart(2, "0");

    const any =
        ara.getFullYear();

    const hora =
        String(ara.getHours()).padStart(2, "0");

    const minuts =
        String(ara.getMinutes()).padStart(2, "0");

    document.getElementById("data").value =
        dia + "/" + mes + "/" + any;

    document.getElementById("hora").value =
        hora + ":" + minuts;

}


actualitzarDataHora();


/* GPS */

function obtenirGPS() {

    const resultat =
        document.getElementById("gps");


    if (!navigator.geolocation) {

        resultat.innerHTML =
            "❌ Aquest dispositiu no permet GPS.";

        return;

    }


    resultat.innerHTML =
        "📍 Buscant la ubicació...";


    navigator.geolocation.getCurrentPosition(

        function(posicio) {

            latitud =
                posicio.coords.latitude;

            longitud =
                posicio.coords.longitude;


            resultat.innerHTML =

                "📍 <b>Ubicació obtinguda ✓</b><br><br>" +

                "Latitud: " +
                latitud.toFixed(6) +

                "<br>" +

                "Longitud: " +
                longitud.toFixed(6);

        },


        function(error) {

            resultat.innerHTML =

                "❌ No s'ha pogut obtenir la ubicació.";

        },


        {

            enableHighAccuracy: true,

            timeout: 15000,

            maximumAge: 0

        }

    );

}


/* GUARDAR */

function guardarTroballa() {

    const missatge =
        document.getElementById("missatge");


    if (latitud === null) {

        missatge.innerHTML =
            "⚠️ Primer has d'obtenir la ubicació GPS.";

        return;

    }


    const troballa = {

        id: Date.now(),

        data:
            document.getElementById("data").value,

        hora:
            document.getElementById("hora").value,

        latitud:
            latitud,

        longitud:
            longitud,

        especie:
            document.getElementById("especie").value,

        quantitat:
            Number(
                document.getElementById("quantitat").value
            ),

        cucs:
            document.getElementById("cucs").value,

        comentari:
            document.getElementById("comentari").value

    };


    let troballes =
        JSON.parse(
            localStorage.getItem("troballes") || "[]"
        );


    troballes.push(troballa);


    localStorage.setItem(
        "troballes",
        JSON.stringify(troballes)
    );


    missatge.innerHTML =
        "🍄 <b>Troballa guardada!</b><br><br>" +

        "📅 " + troballa.data + "<br>" +

        "🕐 " + troballa.hora + "<br>" +

        "🍄 " + troballa.especie + "<br>" +

        "🔢 " + troballa.quantitat + " unitats";

}
function mostrarHistorial() {

    const contenidor =
        document.getElementById("historial");


    let troballes =
        JSON.parse(
            localStorage.getItem("troballes") || "[]"
        );


    if (troballes.length === 0) {

        contenidor.innerHTML =
            "🍄 Encara no hi ha troballes.";

        return;

    }


    troballes =
        troballes.reverse();


    contenidor.innerHTML = "";


    troballes.forEach(function(troballa) {

        const element =
            document.createElement("div");


        element.className = "bloc";


        element.innerHTML =

            "<b>🍄 " +
            troballa.especie +
            "</b><br><br>" +

            "📅 " +
            troballa.data +
            " · " +
            troballa.hora +
            "<br>" +

            "🔢 " +
            troballa.quantitat +
            " unitats<br>" +

            "🪱 " +
            troballa.cucs +
            "<br><br>" +

            "📍 " +
            troballa.latitud.toFixed(6) +
            ", " +
            troballa.longitud.toFixed(6);


        if (troballa.comentari) {

            element.innerHTML +=

                "<br><br>💬 " +
                troballa.comentari;

        }


        contenidor.appendChild(element);

    });

}


mostrarHistorial();
</script>


</body>

</html>
